name: 4. 인스타그램 발행
# schedule re-registered 2026-11-19

# 2026-11-23: 예약 실행 끔. 발행은 "0. 매시간 파이프라인"(scripts/publish_loop.sh)이 배치 단위로 한다.
# 이 예약이 배치 사이에 끼어 1건씩 올리고, 같은 concurrency 그룹의 릴스 단계를 밀어낼 수 있어서.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests -q
      - env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/publish.py
      - if: always()
        run: |
          bash scripts/commit_push.sh "발행: 인스타그램 게시"
