name: 0. 매시간 파이프라인 (수집 + 발행)

# GitHub의 시간 예약(schedule)이 늦거나 안 돌 때를 대비한 보조 장치.
# Claude 편집 작업(5시간마다, 1회 4건)이 data/ledger.json을 푸시하면 실행돼요.
#   1) 뉴스 수집  2) 승인된 게시물을 1시간 간격으로 최대 4건 발행 (간격·차단 쿨다운은 publish.py가 지킴)
on:
  push:
    branches: [main]
    paths: ["data/ledger.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: collect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser -q
      - run: python scripts/collect.py
      - run: |
          bash scripts/commit_push.sh "수집: 뉴스 후보 갱신 (매시간)"

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 230
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests -q
      - name: Publish up to 4 posts, one per hour
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          # publish.py itself enforces the 55-min gap, pause, block cooldown and duplicate checks.
          for i in 1 2 3 4; do
            git pull -q --rebase origin main
            set +e; out=$(python scripts/publish.py 2>&1); rc=$?; set -e
            echo "$out"
            bash scripts/commit_push.sh "발행: 인스타그램 게시"
            if [ $rc -ne 0 ] || echo "$out" | grep -qE "no approved post waiting|dry-run|publishing blocked|limit reached"; then
              break
            fi
            if [ "$i" -lt 4 ]; then sleep 3600; fi
          done
      - if: always()
        run: |
          bash scripts/commit_push.sh "발행: 인스타그램 게시"
