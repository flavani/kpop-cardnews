name: 0. 매시간 파이프라인 (수집 + 발행)

# GitHub의 시간 예약(schedule)이 늦거나 안 돌 때를 대비한 보조 장치.
# Claude 편집 작업이 매시간 data/ledger.json을 푸시하면 그때마다 실행돼요.
#   1) 뉴스 수집  2) 승인된 게시물 최대 1건 발행 (2시간 간격·차단 쿨다운은 publish.py가 지킴)
on:
  push:
    branches: [main]
    paths: ["data/ledger.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: collect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser -q
      - run: python scripts/collect.py
      - run: |
          bash scripts/commit_push.sh "수집: 뉴스 후보 갱신 (매시간)"

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests -q
      - name: Publish at most 1 post (publish.py enforces the 2-hour gap, pause and block cooldown)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git pull -q --rebase origin main
          python scripts/publish.py || echo "publish failed (no retry this run)"
      - if: always()
        run: |
          bash scripts/commit_push.sh "발행: 인스타그램 게시"
