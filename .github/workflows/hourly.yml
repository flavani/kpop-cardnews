name: 0. 매시간 파이프라인 (수집 + 발행)

# GitHub의 시간 예약(schedule)이 늦거나 안 돌 때를 대비한 보조 장치.
# Claude 편집 작업(5시간마다, 1회 4건)이 data/ledger.json을 푸시하면 실행돼요.
#   1) 뉴스 수집  2) 승인된 게시물을 1시간 간격으로 최대 4건 발행 (간격·차단 쿨다운은 publish.py가 지킴)
#   3) 방금 올린 게시물들을 묶은 릴스 1건 (4번째 게시물 1시간 뒤, 대표 소식 아티스트의 곡 첨부)
on:
  push:
    branches: [main]
    paths: ["data/ledger.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: collect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser -q
      - run: python scripts/collect.py
      - run: |
          bash scripts/commit_push.sh "수집: 뉴스 후보 갱신 (매시간)"

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 230
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests -q
      - name: Publish up to 4 posts, one per hour
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: bash scripts/publish_loop.sh
      - if: always()
        run: |
          bash scripts/commit_push.sh "발행: 인스타그램 게시"

  reel:
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt -q
          python -m playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Fonts (Pretendard, SIL OFL)
        run: |
          mkdir -p templates/fonts /tmp/pd
          curl -sSL -o /tmp/pd/p.zip https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          unzip -oq /tmp/pd/p.zip "public/static/Pretendard-*.otf" -d /tmp/pd
          cp /tmp/pd/public/static/*.otf templates/fonts/
      - name: Roundup reel of this batch
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git pull -q --rebase origin main
          python scripts/publish_reel.py
      - if: always()
        run: |
          bash scripts/commit_push.sh "발행: 묶음 릴스"
