name: 0. 매시간 파이프라인 (수집 + 발행)

# GitHub의 시간 예약(schedule)이 늦거나 안 돌 때를 대비한 보조 장치.
# Claude 편집 작업이 매시간 data/ledger.json을 푸시하면 그때마다 실행돼요.
#   1) 뉴스 수집  2) 승인된 게시물을 11분 간격으로 최대 5건 발행
on:
  push:
    branches: [main]
    paths: ["data/ledger.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: collect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser -q
      - run: python scripts/collect.py
      - run: |
          bash scripts/commit_push.sh "수집: 뉴스 후보 갱신 (매시간)"

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 58
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests -q
      - name: Publish up to 5 approved posts, 11 minutes apart
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main
            out=$(python scripts/publish.py 2>&1) || true
            echo "$out"
            bash scripts/commit_push.sh "발행: 인스타그램 게시"
            if echo "$out" | grep -qE "no approved post waiting|dry-run|limit reached"; then
              break
            fi
            [ "$i" -lt 5 ] && sleep 660
          done
