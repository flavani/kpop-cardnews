name: 1. 뉴스 수집
# schedule re-registered 2026-11-19


on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests feedparser
      - run: python scripts/collect.py
      - run: |
          bash scripts/commit_push.sh "수집: 뉴스 후보 갱신"
