name: 1. 뉴스 수집
# schedule re-registered 2026-11-19


on:
  schedule:
    - cron: "*/15 * * * *"
  # Claude 편집 작업이 시작할 때 data/collect_request.json을 푸시하면 바로 수집 (편집 전에 최신 후보 확보)
  push:
    branches: [main]
    paths: ["data/collect_request.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests feedparser
      - run: python scripts/collect.py
      - run: |
          bash scripts/commit_push.sh "수집: 뉴스 후보 갱신"
